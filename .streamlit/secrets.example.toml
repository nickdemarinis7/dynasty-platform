[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "replace-with-a-long-random-secret"
client_id = "replace-with-your-oidc-client-id"
client_secret = "replace-with-your-oidc-client-secret"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[supabase]
# Durable storage is fail-closed and requires the [auth] section above.
# Keep this service-role key server-side; never expose it to a browser client.
url = "https://your-project.supabase.co"
service_role_key = "replace-with-your-server-only-service-role-key"
